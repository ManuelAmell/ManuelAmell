    <style>
      .blink { animation: blink 1.2s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .scan  { animation: scan 4.5s linear infinite; }
      .glitch-a { opacity: 0; animation: ga 5s steps(1) infinite; }
      .glitch-b { opacity: 0; animation: gb 5s steps(1) infinite; }
      .fade  { animation: fade 1.4s ease-out backwards; }
      .fade2 { animation: fade 1.4s ease-out 0.5s backwards; }
      .dash  { stroke-dasharray: 6 10; animation: dash 3s linear infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes scan { from { transform: translateY(-140px) } to { transform: translateY(460px) } }
      @keyframes fade { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
      @keyframes dash { to { stroke-dashoffset: -64 } }
      @keyframes ga { 0%,90%,100% { opacity: 0 } 91% { opacity: .85; transform: translate(-6px,2px) } 93% { opacity: .85; transform: translate(5px,-2px) } 95% { opacity: 0 } }
      @keyframes gb { 0%,90%,100% { opacity: 0 } 91% { opacity: .85; transform: translate(6px,-2px) } 93% { opacity: .85; transform: translate(-5px,3px) } 95% { opacity: 0 } }
