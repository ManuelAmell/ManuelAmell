<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020B1A"/>
      <stop offset="1" stop-color="#042C53"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#85B7EB"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#378ADD"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
      <stop offset="0" stop-color="#185FA5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#020B1A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#185FA5" stroke-opacity="0.25" stroke-width="1"/>
    </pattern>
    <filter id="neon" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="320" rx="14"/></clipPath>
    <style>
      .blink { animation: blink 1.2s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .scan  { animation: scan 4s linear infinite; }
      .glitch-a { opacity: 0; animation: ga 5s steps(1) infinite; }
      .glitch-b { opacity: 0; animation: gb 5s steps(1) infinite; }
      .fade { animation: fade 1.6s ease-out backwards; }
      .fade2 { animation: fade 1.6s ease-out 0.6s backwards; }
      .dash { stroke-dasharray: 6 10; animation: dash 3s linear infinite; }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
      @keyframes pulse { 0%,100% { opacity: .35 } 50% { opacity: 1 } }
      @keyframes scan { from { transform: translateY(-120px) } to { transform: translateY(340px) } }
      @keyframes fade { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
      @keyframes dash { to { stroke-dashoffset: -64 } }
      @keyframes ga { 0%,91%,100% { opacity: 0 } 92% { opacity: .8; transform: translate(-4px,1px) } 94% { opacity: .8; transform: translate(3px,-1px) } 96% { opacity: 0 } }
      @keyframes gb { 0%,91%,100% { opacity: 0 } 92% { opacity: .8; transform: translate(4px,-1px) } 94% { opacity: .8; transform: translate(-3px,2px) } 96% { opacity: 0 } }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <rect width="1200" height="320" fill="url(#glow)"/>
    <rect class="scan" x="0" y="0" width="1200" height="110" fill="url(#scan)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="14" fill="none" stroke="#185FA5"/>

  <!-- HUD corners -->
  <g stroke="#00E5FF" stroke-width="3" fill="none" filter="url(#neon)">
    <path d="M24 64V24H64"/><path d="M1136 24H1176V64"/>
    <path d="M24 256V296H64"/><path d="M1136 296H1176V256"/>
  </g>

  <!-- top status bar -->
  <g font-size="14" fill="#85B7EB">
    <text x="84" y="44">AMELL.SYS // v2026.11</text>
    <circle class="blink" cx="964" cy="39" r="6" fill="#00E5FF" filter="url(#neon)"/>
    <text x="978" y="44" fill="#00E5FF" font-weight="700">SYSTEMS ONLINE</text>
  </g>
  <line class="dash" x1="84" y1="58" x2="1116" y2="58" stroke="#378ADD" stroke-opacity="0.6"/>

  <!-- name -->
  <g text-anchor="middle" font-weight="700" font-size="76" letter-spacing="10">
    <text class="glitch-a" x="600" y="168" fill="#FF2E88">MANUEL AMELL</text>
    <text class="glitch-b" x="600" y="168" fill="#00E5FF">MANUEL AMELL</text>
    <text class="fade" x="600" y="168" fill="url(#title)" filter="url(#neon)">MANUEL AMELL</text>
  </g>

  <text class="fade2" x="600" y="214" text-anchor="middle" font-size="20" fill="#B5D4F4" letter-spacing="1">Systems Engineering Student  ·  Full-stack &amp; AI tooling  ·  Cartagena, CO</text>

  <!-- bottom readouts -->
  <line class="dash" x1="84" y1="252" x2="1116" y2="252" stroke="#378ADD" stroke-opacity="0.6"/>
  <g font-size="13" fill="#5A8DBF">
    <text x="84" y="280">LAT 10.39°N · LON 75.51°W</text>
    <text x="600" y="280" text-anchor="middle">[ build · ship · iterate ]</text>
    <text x="1116" y="280" text-anchor="end">UPTIME SINCE 2024.09</text>
  </g>
  <g class="pulse" fill="#00E5FF">
    <rect x="420" y="272" width="10" height="10"/>
    <rect x="770" y="272" width="10" height="10"/>
  </g>
</svg>
