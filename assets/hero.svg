    <style>
      .blink { animation: blink 1.2s steps(1) infinite; }
      .pulse { animation: pulse 2.4s ease-in-out infinite; }
      .scan  { animation: scan 4.5s linear infinite; }
      .glitch-a { opacity: 0; animation: ga 5s steps(1) infinite; }
