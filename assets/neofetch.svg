<svg xml:space="preserve" xmlns="http://www.w3.org/2000/svg" width="840" height="875" viewBox="0 0 840 875" font-family="'Fira Code', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A3D6F"/>
      <stop offset="1" stop-color="#020B1A"/>
    </linearGradient>
    <pattern id="lines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#00E5FF" opacity="0.04"/>
    </pattern>
    <style>
      .k { fill: #00E5FF; font-weight: 700; }
      .v { fill: #E8EEF7; }
      text { white-space: pre; }
      .m { fill: #5A8DBF; }
      .ok { fill: #7FD99A; }
      .row { animation: in .35s ease-out backwards; }
      .cur { animation: blink 1s steps(1) infinite; }
      @keyframes in { from { opacity: 0; transform: translateX(-10px) } to { opacity: 1; transform: none } }
      @keyframes blink { 0%,100% { opacity: 1 } 50% { opacity: 0 } }
    </style>
  </defs>
  <rect width="840" height="875" rx="12" fill="url(#bg)"/>
  <rect width="840" height="875" rx="12" fill="url(#lines)"/>
  <rect x="0.5" y="0.5" width="839" height="874" rx="12" fill="none" stroke="#185FA5"/>

  <!-- title bar -->
  <path d="M0.5 56V12.5A12 12 0 0 1 12.5 0.5H827.5A12 12 0 0 1 839.5 12.5V56Z" fill="#042C53" stroke="#185FA5"/>
  <circle cx="30" cy="28" r="7" fill="#ff5f56"/>
  <circle cx="54" cy="28" r="7" fill="#ffbd2e"/>
  <circle cx="78" cy="28" r="7" fill="#27c93f"/>
