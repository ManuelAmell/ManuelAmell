    <g class="row" style="animation-delay:.6s"><text x="44" y="340"><tspan class="k">Degree   </tspan><tspan class="v">Systems Engineering</tspan></text></g>
    <g class="row" style="animation-delay:.7s"><text x="44" y="382"><tspan class="k">Status   </tspan><tspan class="ok">● online — shipping</tspan></text></g>
    <g class="row" style="animation-delay:.8s"><text x="44" y="424"><tspan class="k">Started  </tspan><tspan class="v">Sep 2024</tspan></text></g>
    <g class="row" style="animation-delay:.9s"><text x="44" y="466"><tspan class="k">Updated  </tspan><tspan class="ok">Nov 2026</tspan></text></g>
    <g class="row" style="animation-delay:1s"><text x="44" y="508"><tspan class="k">OS       </tspan><tspan class="v">Omarchy · Hyprland</tspan></text></g>
    <g class="row" style="animation-delay:1.1s"><text x="44" y="550"><tspan class="k">Langs    </tspan><tspan fill="#3178C6">TS</tspan><tspan class="m"> · </tspan><tspan fill="#F2D06B">Python</tspan><tspan class="m"> · </tspan><tspan fill="#E37B7B">C++</tspan><tspan class="m"> · </tspan><tspan fill="#E8A33D">Java</tspan></text></g>
    <g class="row" style="animation-delay:1.2s"><text x="44" y="590"><tspan class="k">         </tspan><tspan fill="#B07FE0">C#</tspan><tspan class="m"> · </tspan><tspan fill="#7FA8D9">SQL</tspan><tspan class="m"> · </tspan><tspan fill="#F7DF1E">JavaScript</tspan></text></g>
    <g class="row" style="animation-delay:1.3s"><text x="44" y="632"><tspan class="k">Focus    </tspan><tspan class="v">Full-stack · Data · AI agents</tspan></text></g>
    <g class="row" style="animation-delay:1.4s"><text x="44" y="674"><tspan class="k">Repos    </tspan><tspan class="v">29 repos · 18 public</tspan></text></g>

    <g class="row" style="animation-delay:1.5s"><text x="44" y="716" class="m">────────────────────────────────────</text></g>
    <g class="row" style="animation-delay:1.6s">
      <text x="44" y="760" font-size="22" fill="#9FB8D6" font-style="italic">"Stay hungry. Stay foolish."</text>
      <text x="44" y="794" font-size="20" class="m">— Steve Jobs</text>
    </g>

    <g class="row" style="animation-delay:1.7s">
