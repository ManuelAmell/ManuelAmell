    <g class="row" style="animation-delay:.3s"><text x="44" y="210" class="m">────────────────────────────────────</text></g>

    <g class="row" style="animation-delay:.4s"><text x="44" y="256"><tspan class="k">Name     </tspan><tspan class="v">Manuel Amell</tspan></text></g>
