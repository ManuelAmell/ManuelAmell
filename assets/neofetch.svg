      <rect x="284" y="818" width="36" height="22" fill="#7FD99A"/>
      <rect x="324" y="818" width="36" height="22" fill="#FF2E88"/>
      <rect class="cur" x="380" y="818" width="14" height="22" fill="#00E5FF"/>
