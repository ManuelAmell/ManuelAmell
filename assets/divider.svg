<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="16" viewBox="0 0 1200 16">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00E5FF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#00E5FF"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .run { animation: run 3.5s linear infinite; }
      @keyframes run { from { transform: translateX(-400px) } to { transform: translateX(1200px) } }
    </style>
  </defs>
  <line x1="0" y1="8" x2="1200" y2="8" stroke="#185FA5" stroke-width="1"/>
  <rect class="run" x="0" y="6" width="400" height="4" rx="2" fill="url(#g)"/>
  <circle cx="600" cy="8" r="3" fill="#00E5FF"/>
</svg>
